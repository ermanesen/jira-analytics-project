name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Build analytical model and exports
        env:
          PYTHONPATH: src
        run: python scripts/run_pipeline.py --verbose
      - name: Execute notebook from top to bottom
        env:
          PYTHONPATH: src
        run: jupyter nbconvert --to notebook --execute notebooks/customer_lifecycle_analysis.ipynb --inplace --ExecutePreprocessor.timeout=180
      - name: Run automated tests
        env:
          PYTHONPATH: src
        run: pytest -q

