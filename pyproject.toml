[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-revenue-retention-analytics"
version = "1.0.0"
description = "Reproducible DuckDB analytics pipeline for revenue and customer lifecycle decisions"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

